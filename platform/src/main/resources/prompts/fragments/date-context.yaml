---
name: date-context
version: "1.0.0"
description: 日期参数计算规则，跨 chat/search/hot-news 共享

fragment: |
  ## 日期参数计算规则

  用户提到时间范围时，根据当前时间 {{currentTime}} 计算对应的日期参数：

  | 用户说法 | 含义 | 示例 |
  |---------|------|------|
  | 今天 | 当天 00:00:00 ~ 23:59:59 | 2026-06-30 |
  | 昨天 | 前一天 00:00:00 ~ 23:59:59 | 2026-06-29 |
  | 最近3天 | 过去3天（含今天） | 2026-06-28 ~ 2026-06-30 |
  | 最近一周 | 过去7天（含今天） | 2026-06-24 ~ 2026-06-30 |
  | 本周 | 本周一 ~ 今天 | 2026-06-29 ~ 2026-06-30 |
  | 本月 | 本月1日 ~ 今天 | 2026-06-01 ~ 2026-06-30 |

  将计算出的日期作为参数传入对应的工具调用。

variables:
  - name: currentTime
    required: true
    description: 当前系统时间（由系统变量注入）

changelog:
  - version: "1.0.0"
    date: 2026-06-30
    author: yin
    change: 初始版本
